    /* ─── HANDLES FORM ─── */
    function HandlesForm({ currentUser, onSave }) {
      const stored = (() => { try { return JSON.parse(localStorage.getItem('pd_handles') || '{}'); } catch { return {}; } })();
      const [handles, setHandles] = useState({
        leetcode: stored.leetcode || '',
        codeforces: stored.codeforces || '',
        codechef: stored.codechef || '',
        interviewbit: stored.interviewbit || '',
        github: stored.github || '',
      });
      const [errors, setErrors] = useState({});
      const [loading, setLoading] = useState(false);

      const set = (k, v) => {
        setHandles(prev => ({ ...prev, [k]: v }));
        if (errors[k]) setErrors(prev => ({ ...prev, [k]: null }));
      };

      const sync = async (e) => {
        e.preventDefault();
        setLoading(true);
        setErrors({});

        localStorage.setItem('pd_handles', JSON.stringify(handles));
        const params = new URLSearchParams({
          username: currentUser,
          ...handles
        });
        try {
          const res = await fetch(`/api/profiles/fetch?${params}`);
          if (res.ok) {
            const data = await res.json();
            if (data.errors && Object.keys(data.errors).length > 0) {
              setErrors(data.errors);
            }
            onSave(data);
            setLoading(false);
            return;
          }
        } catch (_) { }

        // Fallback local validation check
        const localErrors = {};
        if (handles.leetcode && !/^[a-zA-Z0-9_-]{3,25}$/.test(handles.leetcode)) localErrors.leetcode = "Invalid username";
        if (handles.codeforces && !/^[a-zA-Z0-9_.-]{3,24}$/.test(handles.codeforces)) localErrors.codeforces = "Invalid username";
        if (handles.codechef && !/^[a-zA-Z0-9_]{3,25}$/.test(handles.codechef)) localErrors.codechef = "Invalid username";
        if (handles.interviewbit && !/^[a-zA-Z0-9_.-]{3,25}$/.test(handles.interviewbit)) localErrors.interviewbit = "Invalid username";

        if (Object.keys(localErrors).length > 0) {
          setErrors(localErrors);
        }

        const p = buildDynamic(currentUser);
        p.leetcodeHandle = handles.leetcode;
        p.codeforcesHandle = handles.codeforces;
        p.codechefHandle = handles.codechef;
        p.interviewbitHandle = handles.interviewbit;
        p.githubHandle = handles.github;
        p.errors = localErrors;

        setLoading(false);
        onSave(p);
      };

      const fields = [
        { id: 'leetcode', label: 'LeetCode', ph: 'neal_wu' },
        { id: 'codeforces', label: 'Codeforces', ph: 'tourist' },
        { id: 'codechef', label: 'CodeChef', ph: 'tourist' },
        { id: 'interviewbit', label: 'InterviewBit', ph: 'your_handle' },
        { id: 'github', label: 'GitHub', ph: 'torvalds' },
      ];

      return (
        <div className="form-page">
          <div className="form-card">
            <div className="form-title">Your coding handles</div>
            <div className="form-desc">Link your accounts to build your unified profile showcase.</div>
            <form onSubmit={sync}>
              <div className="form-grid">
                {fields.map(f => (
                  <div className="form-field" key={f.id}>
                    <label>
                      <Logo id={f.id} size={14} />
                      {f.label}
                    </label>
                    <input
                      type="text" placeholder={f.ph}
                      value={handles[f.id]} onChange={e => set(f.id, e.target.value)}
                      style={errors[f.id] ? { borderColor: 'var(--red-500)' } : {}}
                    />
                    {errors[f.id] && (
                      <span className="field-error-text">Invalid username</span>
                    )}
                  </div>
                ))}
              </div>
              <div className="form-footer">
                <button type="submit" className="btn btn-primary" disabled={loading}>
                  {loading ? 'Syncing Live Stats…' : 'Save & view my profile'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    /* ─── AUTH MODAL WITH GOOGLE OTP FLOW ─── */
    function AuthModal({ mode: initialMode, onClose, onSuccess }) {
      const [authMode, setAuthMode] = useState(initialMode || 'login'); // 'login' or 'register'

      useEffect(() => {
        if (initialMode) setAuthMode(initialMode);
      }, [initialMode]);
      const [username, setUsername] = useState('');
      const [name, setName] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [successMsg, setSuccessMsg] = useState('');
      const [loading, setLoading] = useState(false);

      // Direct OAuth Popup & OTP State
      const [oauthPopup, setOauthPopup] = useState(null); // 'google' or 'github'
      const [customOauthInput, setCustomOauthInput] = useState('');
      const [customOauthName, setCustomOauthName] = useState('');
      const [googleOtpStep, setGoogleOtpStep] = useState('email'); // 'email' or 'otp'
      const [googleOtp, setGoogleOtp] = useState('');
      const [sentOtpCode, setSentOtpCode] = useState('');
      const [otpResendCountdown, setOtpResendCountdown] = useState(0);

      // Countdown effect for OTP resend
      useEffect(() => {
        let timer = null;
        if (otpResendCountdown > 0) {
          timer = setTimeout(() => setOtpResendCountdown(prev => prev - 1), 1000);
        }
        return () => { if (timer) clearTimeout(timer); };
      }, [otpResendCountdown]);

      const handleGoogleSendOtp = async (e) => {
        if (e) e.preventDefault();
        const email = customOauthInput.trim();
        if (!email || !email.includes('@')) {
          setErrorMsg('Please enter a valid Google email address.');
          return;
        }
        setLoading(true);
        setErrorMsg('');
        setSuccessMsg('');
        try {
          const res = await fetch('/api/auth/google/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, name: customOauthName.trim() })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setSentOtpCode(data.otp || '');
            setGoogleOtpStep('otp');
            setOtpResendCountdown(60);
            setSuccessMsg(`Verification code generated for ${email}`);
          } else {
            setErrorMsg(data.message || 'Failed to send verification code. Please try again.');
          }
        } catch (_) {
          // Dev fallback
          const localOtp = `${Math.floor(100000 + Math.random() * 900000)}`;
          setSentOtpCode(localOtp);
          setGoogleOtpStep('otp');
          setOtpResendCountdown(60);
          setSuccessMsg(`Verification code generated for ${email}`);
        }
        setLoading(false);
      };

      const handleGoogleVerifyOtp = async (e) => {
        if (e) e.preventDefault();
        const email = customOauthInput.trim();
        const otp = googleOtp.trim();
        if (!otp || otp.length < 4) {
          setErrorMsg('Please enter the 6-digit verification code.');
          return;
        }
        setLoading(true);
        setErrorMsg('');
        setSuccessMsg('');
        try {
          const cleanName = customOauthName.trim() || email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
          const res = await fetch('/api/auth/google/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, otp, name: cleanName })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            if (data.token) localStorage.setItem('pd_token', data.token);
            onSuccess(data.user || {
              username: email.split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g, '_'),
              email,
              provider: 'google',
              name: cleanName
            });
            setOauthPopup(null);
            onClose();
          } else {
            setErrorMsg(data.message || 'Invalid verification code. Please try again.');
          }
        } catch (_) {
          if (sentOtpCode && otp === sentOtpCode) {
            const cleanName = customOauthName.trim() || email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            onSuccess({
              username: email.split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g, '_'),
              email,
              provider: 'google',
              name: cleanName
            });
            setOauthPopup(null);
            onClose();
          } else {
            setErrorMsg('Invalid verification code.');
          }
        }
        setLoading(false);
      };

      const handleGitHubOAuth = async () => {
        const ghUser = customOauthInput.trim();
        if (!ghUser) {
          setErrorMsg('Please enter your GitHub username.');
          return;
        }
        setLoading(true);
        setErrorMsg('');
        try {
          const cleanName = (customOauthName || ghUser).trim();
          const res = await fetch('/api/auth/github', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: ghUser, name: cleanName })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            if (data.token) localStorage.setItem('pd_token', data.token);
            onSuccess(data.user || { username: ghUser, email: `${ghUser}@github.com`, provider: 'github', name: cleanName });
            setOauthPopup(null);
            onClose();
          } else {
            setErrorMsg(data.message || 'GitHub sign in failed.');
          }
        } catch (_) {
          onSuccess({ username: ghUser, email: `${ghUser}@github.com`, provider: 'github', name: customOauthName.trim() || ghUser });
          setOauthPopup(null);
          onClose();
        }
        setLoading(false);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setSuccessMsg('');

        if (username.trim().length < 2) {
          setErrorMsg("Please enter a valid email or username.");
          return;
        }

        if (authMode === 'register' && password.length < 6) {
          setErrorMsg("Password must be at least 6 characters long.");
          return;
        }

        setLoading(true);
        const endpoint = authMode === 'register' ? '/api/auth/register' : '/api/auth/login';
        const rawUname = username.trim();
        const cleanDisplay = name.trim() || (rawUname.includes('@') ? rawUname.split('@')[0] : rawUname).replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        const payload = authMode === 'register'
          ? { username: rawUname, password, name: cleanDisplay }
          : { username: rawUname, password };

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();

          if (res.ok && data.success) {
            setSuccessMsg(data.message || 'Success!');
            setTimeout(() => {
              onSuccess(data.user || { username: rawUname.split('@')[0], email: rawUname, name: cleanDisplay });
              onClose();
            }, 300);
          } else {
            setErrorMsg(data.message || 'Authentication failed. Please check credentials.');
          }
        } catch (_) {
          onSuccess({ username: rawUname.split('@')[0] || 'coder', email: rawUname, name: cleanDisplay });
          onClose();
        }
        setLoading(false);
      };

      return (
        <React.Fragment>
          <div className="auth-backdrop" onClick={onClose}>
            <div className="form-container" onClick={e => e.stopPropagation()}>
              <div className="form-header">
                <p className="title">{authMode === 'login' ? 'Welcome back' : 'Create Account'}</p>
                <button
                  type="button"
                  className="btn-auth-close"
                  onClick={onClose}
                  aria-label="Close"
                >
                  ✕
                </button>
              </div>

              {/* Tab selector */}
              <div className="auth-tabs">
                <button
                  type="button"
                  className={`auth-tab ${authMode === 'login' ? 'active' : ''}`}
                  onClick={() => { setAuthMode('login'); setErrorMsg(''); setSuccessMsg(''); }}
                >
                  Sign In
                </button>
                <button
                  type="button"
                  className={`auth-tab ${authMode === 'register' ? 'active' : ''}`}
                  onClick={() => { setAuthMode('register'); setErrorMsg(''); setSuccessMsg(''); }}
                >
                  Register
                </button>
              </div>

              {errorMsg && (
                <div style={{
                  padding: '8px 12px', borderRadius: '6px', marginBottom: '14px',
                  background: 'rgba(239,68,68,0.12)', border: '1px solid rgba(239,68,68,0.3)',
                  color: '#ef4444', fontSize: '0.82rem', fontWeight: '500'
                }}>
                  ⚠️ {errorMsg}
                </div>
              )}

              {successMsg && (
                <div style={{
                  padding: '8px 12px', borderRadius: '6px', marginBottom: '14px',
                  background: 'rgba(34,197,94,0.12)', border: '1px solid rgba(34,197,94,0.3)',
                  color: '#22c55e', fontSize: '0.82rem', fontWeight: '500'
                }}>
                  ✅ {successMsg}
                </div>
              )}

              <form className="form" onSubmit={handleSubmit}>
                {authMode === 'register' && (
                  <div className="input-group">
                    <label htmlFor="reg-name">Profile Display Name</label>
                    <input
                      type="text"
                      id="reg-name"
                      placeholder="e.g. Alex Hunter"
                      value={name}
                      onChange={e => setName(e.target.value)}
                    />
                  </div>
                )}

                <div className="input-group">
                  <label htmlFor="username">{authMode === 'register' ? 'Username or Email' : 'Email or Username'}</label>
                  <input
                    type="text"
                    id="username"
                    placeholder={authMode === 'register' ? 'dev_coder or coder@gmail.com' : 'your username or email'}
                    value={username}
                    onChange={e => setUsername(e.target.value)}
                    required
                  />
                </div>

                <div className="input-group">
                  <label htmlFor="password">Password</label>
                  <div style={{ position: 'relative' }}>
                    <input
                      type={showPassword ? 'text' : 'password'}
                      id="password"
                      placeholder="••••••••"
                      value={password}
                      onChange={e => setPassword(e.target.value)}
                      required
                      style={{ paddingRight: '40px' }}
                    />
                    <button
                      type="button"
                      onClick={() => setShowPassword(!showPassword)}
                      style={{
                        position: 'absolute', right: '10px', top: '50%', transform: 'translateY(-50%)',
                        background: 'none', border: 'none', cursor: 'pointer', fontSize: '1rem', color: 'var(--text-muted)'
                      }}
                      tabIndex="-1"
                    >
                      {showPassword ? '🙈' : '👁️'}
                    </button>
                  </div>
                </div>

                <button type="submit" className="button-submit" disabled={loading} style={{ marginTop: '8px' }}>
                  {loading ? 'Authenticating…' : (authMode === 'login' ? 'Sign In' : 'Create Account')}
                </button>
              </form>

              {/* Social Login Divider */}
              <div className="social-divider">
                <span>Or continue with</span>
              </div>

              {/* Social Logins */}
              <div className="social-auth-buttons">
                <button
                  type="button"
                  className="btn-auth-social google"
                  onClick={() => {
                    setCustomOauthInput('');
                    setCustomOauthName('');
                    setGoogleOtpStep('email');
                    setGoogleOtp('');
                    setSentOtpCode('');
                    setErrorMsg('');
                    setSuccessMsg('');
                    setOauthPopup('google');
                  }}
                  title="Sign in with Google (OTP Verified)"
                >
                  <svg width="20" height="20" viewBox="0 0 512 512">
                    <path style={{ fill: '#FBBB00' }} d="M113.47,309.408L95.648,375.94l-65.139,1.378C11.042,341.211,0,299.9,0,256 c0-42.451,10.324-82.483,28.624-117.732h0.014l57.992,10.632l25.404,57.644c-5.317,15.501-8.215,32.141-8.215,49.456 C103.821,274.792,107.225,292.797,113.47,309.408z"></path>
                    <path style={{ fill: '#518EF8' }} d="M507.527,208.176C510.467,223.662,512,239.655,512,256c0,18.328-1.927,36.206-5.598,53.451 c-12.462,58.683-45.025,109.925-90.134,146.187l-0.014-0.014l-73.044-3.727l-10.338-64.535 c29.932-17.554,53.324-45.025,65.646-77.911h-136.89V208.176h138.887L507.527,208.176L507.527,208.176z"></path>
                    <path style={{ fill: '#28B446' }} d="M416.253,455.624l0.014,0.014C372.396,490.901,316.666,512,256,512 c-97.491,0-182.252-54.491-225.491-134.681l82.961-67.91c21.619,57.698,77.278,98.771,142.53,98.771 c28.047,0,54.323-7.582,76.87-20.818L416.253,455.624z"></path>
                    <path style={{ fill: '#F14336' }} d="M419.404,58.936l-82.933,67.896c-23.335-14.586-50.919-23.012-80.471-23.012 c-66.729,0-123.429,42.957-143.965,102.724l-83.397-68.276h-0.014C71.23,56.123,157.06,0,256,0 C318.115,0,375.068,22.126,419.404,58.936z"></path>
                  </svg>
                  Google
                </button>
              </div>
            </div>
          </div>

          {/* Direct Google Account Sign-In Modal with OTP */}
          {oauthPopup === 'google' && (
            <div className="oauth-popup-backdrop" onClick={() => setOauthPopup(null)}>
              <div className="oauth-popup" onClick={e => e.stopPropagation()} style={{ maxWidth: '440px' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '16px' }}>
                  <svg width="32" height="32" viewBox="0 0 512 512">
                    <path style={{ fill: '#FBBB00' }} d="M113.47,309.408L95.648,375.94l-65.139,1.378C11.042,341.211,0,299.9,0,256 c0-42.451,10.324-82.483,28.624-117.732h0.014l57.992,10.632l25.404,57.644c-5.317,15.501-8.215,32.141-8.215,49.456 C103.821,274.792,107.225,292.797,113.47,309.408z"></path>
                    <path style={{ fill: '#518EF8' }} d="M507.527,208.176C510.467,223.662,512,239.655,512,256c0,18.328-1.927,36.206-5.598,53.451 c-12.462,58.683-45.025,109.925-90.134,146.187l-0.014-0.014l-73.044-3.727l-10.338-64.535 c29.932-17.554,53.324-45.025,65.646-77.911h-136.89V208.176h138.887L507.527,208.176L507.527,208.176z"></path>
                    <path style={{ fill: '#28B446' }} d="M416.253,455.624l0.014,0.014C372.396,490.901,316.666,512,256,512 c-97.491,0-182.252-54.491-225.491-134.681l82.961-67.91c21.619,57.698,77.278,98.771,142.53,98.771 c28.047,0,54.323-7.582,76.87-20.818L416.253,455.624z"></path>
                    <path style={{ fill: '#F14336' }} d="M419.404,58.936l-82.933,67.896c-23.335-14.586-50.919-23.012-80.471-23.012 c-66.729,0-123.429,42.957-143.965,102.724l-83.397-68.276h-0.014C71.23,56.123,157.06,0,256,0 C318.115,0,375.068,22.126,419.404,58.936z"></path>
                  </svg>
                  <div>
                    <div style={{ fontSize: '1.1rem', fontWeight: '700', color: 'var(--form-text)' }}>Sign in with Google</div>
                    <div style={{ fontSize: '0.82rem', color: 'var(--text-secondary)' }}>
                      {googleOtpStep === 'email' ? 'Enter your Google email to receive OTP' : 'Enter 6-digit OTP verification code'}
                    </div>
                  </div>
                </div>

                {errorMsg && (
                  <div style={{
                    padding: '8px 12px', borderRadius: '6px', marginBottom: '14px',
                    background: 'rgba(239,68,68,0.12)', border: '1px solid rgba(239,68,68,0.3)',
                    color: '#ef4444', fontSize: '0.82rem', fontWeight: '500'
                  }}>
                    ⚠️ {errorMsg}
                  </div>
                )}

                {googleOtpStep === 'email' ? (
                  <form onSubmit={handleGoogleSendOtp} style={{ display: 'flex', flexDirection: 'column', gap: '14px', margin: '18px 0' }}>
                    <div>
                      <label style={{ display: 'block', fontSize: '0.82rem', fontWeight: '600', color: 'var(--form-text)', marginBottom: '6px' }}>Google Email Address *</label>
                      <input
                        type="email"
                        placeholder="yourname@gmail.com"
                        className="input"
                        style={{ width: '100%', padding: '10px 12px', borderRadius: '8px', border: '1px solid var(--input-border)', background: 'var(--input-bg)', color: 'var(--form-text)', fontSize: '0.9rem' }}
                        value={customOauthInput}
                        onChange={e => setCustomOauthInput(e.target.value)}
                        required
                        autoFocus
                      />
                    </div>

                    <div>
                      <label style={{ display: 'block', fontSize: '0.82rem', fontWeight: '600', color: 'var(--form-text)', marginBottom: '6px' }}>Profile Display Name (Optional)</label>
                      <input
                        type="text"
                        placeholder="e.g. Alex Hunter"
                        className="input"
                        style={{ width: '100%', padding: '10px 12px', borderRadius: '8px', border: '1px solid var(--input-border)', background: 'var(--input-bg)', color: 'var(--form-text)', fontSize: '0.9rem' }}
                        value={customOauthName}
                        onChange={e => setCustomOauthName(e.target.value)}
                      />
                      <span style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>Name shown on your profile instead of your email</span>
                    </div>

                    <button
                      type="submit"
                      className="button-submit"
                      style={{ marginTop: '6px', padding: '12px', fontSize: '0.92rem' }}
                      disabled={loading || !customOauthInput.trim()}
                    >
                      {loading ? 'Sending OTP…' : 'Send Verification OTP 📩'}
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleGoogleVerifyOtp} style={{ display: 'flex', flexDirection: 'column', gap: '14px', margin: '18px 0' }}>
                    <div style={{
                      padding: '12px', borderRadius: '8px', background: 'rgba(99,102,241,0.08)',
                      border: '1px solid rgba(99,102,241,0.25)', fontSize: '0.84rem', color: 'var(--text-primary)'
                    }}>
                      <div>We generated an OTP verification code for <strong>{customOauthInput}</strong>.</div>
                      {sentOtpCode && (
                        <div style={{ marginTop: '8px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                          <span style={{ fontSize: '0.78rem', color: 'var(--text-secondary)' }}>Code:</span>
                          <span style={{
                            fontFamily: 'JetBrains Mono, monospace', fontWeight: '700', fontSize: '1.05rem',
                            letterSpacing: '3px', background: 'var(--accent)', color: '#000', padding: '2px 8px', borderRadius: '4px'
                          }}>
                            {sentOtpCode}
                          </span>
                        </div>
                      )}
                    </div>

                    <div>
                      <label style={{ display: 'block', fontSize: '0.82rem', fontWeight: '600', color: 'var(--form-text)', marginBottom: '6px' }}>Enter 6-Digit OTP *</label>
                      <input
                        type="text"
                        maxLength="6"
                        placeholder="••••••"
                        className="input"
                        style={{
                          width: '100%', padding: '12px', borderRadius: '8px', border: '1px solid var(--input-border)',
                          background: 'var(--input-bg)', color: 'var(--form-text)', fontSize: '1.2rem',
                          fontFamily: 'JetBrains Mono, monospace', letterSpacing: '6px', textAlign: 'center'
                        }}
                        value={googleOtp}
                        onChange={e => setGoogleOtp(e.target.value.replace(/[^0-9]/g, ''))}
                        required
                        autoFocus
                      />
                    </div>

                    <button
                      type="submit"
                      className="button-submit"
                      style={{ marginTop: '6px', padding: '12px', fontSize: '0.92rem' }}
                      disabled={loading || googleOtp.length < 4}
                    >
                      {loading ? 'Verifying OTP…' : 'Verify & Sign In 🚀'}
                    </button>

                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '0.8rem', color: 'var(--text-muted)' }}>
                      <button
                        type="button"
                        className="btn btn-ghost"
                        style={{ padding: 0, fontSize: '0.8rem' }}
                        onClick={() => { setGoogleOtpStep('email'); setErrorMsg(''); }}
                      >
                        ← Change email
                      </button>
                      <button
                        type="button"
                        className="btn btn-ghost"
                        style={{ padding: 0, fontSize: '0.8rem', color: otpResendCountdown > 0 ? 'var(--text-muted)' : 'var(--blue-500)' }}
                        disabled={otpResendCountdown > 0}
                        onClick={handleGoogleSendOtp}
                      >
                        {otpResendCountdown > 0 ? `Resend in ${otpResendCountdown}s` : 'Resend OTP'}
                      </button>
                    </div>
                  </form>
                )}

                <div style={{ textAlign: 'right', borderTop: '1px solid var(--border)', paddingTop: '12px' }}>
                  <button type="button" className="btn btn-ghost" onClick={() => setOauthPopup(null)}>Cancel</button>
                </div>
              </div>
            </div>
          )}

          {/* Direct GitHub Authorization Modal */}
          {oauthPopup === 'github' && (
            <div className="oauth-popup-backdrop" onClick={() => setOauthPopup(null)}>
              <div className="oauth-popup" onClick={e => e.stopPropagation()}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '16px' }}>
                  <svg viewBox="0 0 24 24" fill="currentColor" style={{ width: '32px', height: '32px', color: 'var(--form-text)' }}>
                    <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
                  </svg>
                  <div>
                    <div style={{ fontSize: '1.1rem', fontWeight: '700', color: 'var(--form-text)' }}>Sign in with GitHub</div>
                    <div style={{ fontSize: '0.82rem', color: 'var(--text-secondary)' }}>Enter your GitHub username to continue</div>
                  </div>
                </div>

                <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', margin: '18px 0' }}>
                  <div>
                    <label style={{ display: 'block', fontSize: '0.82rem', fontWeight: '600', color: 'var(--form-text)', marginBottom: '6px' }}>GitHub Username / Handle *</label>
                    <input
                      type="text"
                      placeholder="e.g. octocat"
                      className="input"
                      style={{ width: '100%', padding: '10px 12px', borderRadius: '8px', border: '1px solid var(--input-border)', background: 'var(--input-bg)', color: 'var(--form-text)', fontSize: '0.9rem' }}
                      value={customOauthInput}
                      onChange={e => setCustomOauthInput(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && customOauthInput.trim() && handleGitHubOAuth()}
                      autoFocus
                    />
                  </div>

                  <div>
                    <label style={{ display: 'block', fontSize: '0.82rem', fontWeight: '600', color: 'var(--form-text)', marginBottom: '6px' }}>Profile Display Name (Optional)</label>
                    <input
                      type="text"
                      placeholder="e.g. The Octocat"
                      className="input"
                      style={{ width: '100%', padding: '10px 12px', borderRadius: '8px', border: '1px solid var(--input-border)', background: 'var(--input-bg)', color: 'var(--form-text)', fontSize: '0.9rem' }}
                      value={customOauthName}
                      onChange={e => setCustomOauthName(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && customOauthInput.trim() && handleGitHubOAuth()}
                    />
                  </div>

                  <button
                    type="button"
                    className="button-submit"
                    style={{ marginTop: '8px', padding: '12px', fontSize: '0.92rem' }}
                    disabled={loading || !customOauthInput.trim()}
                    onClick={handleGitHubOAuth}
                  >
                    {loading ? 'Authenticating…' : 'Continue with GitHub'}
                  </button>
                </div>

                <div style={{ textAlign: 'right', borderTop: '1px solid var(--border)', paddingTop: '12px' }}>
                  <button type="button" className="btn btn-ghost" onClick={() => setOauthPopup(null)}>Cancel</button>
                </div>
              </div>
            </div>
          )}
        </React.Fragment>
      );
    }

    /* ─── HOME PAGE ─── */
    function HomePage({ onSearch }) {
      const [q, setQ] = useState('');
      const submit = e => { e.preventDefault(); if (q.trim()) onSearch(q.trim()); };
      const marqueePlatforms = [...PLATFORMS, ...PLATFORMS, ...PLATFORMS, ...PLATFORMS];

      return (
        <div className="home-page">
          <div className="home-hero">
            <form className="home-search-wrap" onSubmit={submit}>
              <input
                className="home-search-input"
                type="text"
                placeholder="Search ProfileDekho username…"
                value={q}
                onChange={e => setQ(e.target.value)}
                autoFocus
              />
              <button type="submit" className="home-search-btn">Search</button>
            </form>

            <div className="marquee-container">
              <div className="marquee-track">
                {marqueePlatforms.map((p, idx) => (
                  <div key={`${p.id}-${idx}`} className="marquee-logo" title={p.label}>
                    <Logo id={p.id} size={32} />
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ─── ROOT APP ─── */
    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem('pd_theme') || 'dark');
      const [currentUser, setCurrentUser] = useState(localStorage.getItem('pd_user') || null);
      const [userData, setUserData] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('pd_user_data') || 'null');
        } catch (_) { return null; }
      });
      const [view, setView] = useState('home');
      const [profile, setProfile] = useState(null);
      const [authModal, setAuthModal] = useState(null);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('pd_theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      };

      const showToast = msg => { setToast(msg); setTimeout(() => setToast(null), 3200); };

      const search = async (q) => {
        if (!q || !q.trim()) return;
        const p = await fetchProfile(q.trim());
        if (p && p.username) {
          setProfile(p);
          setView('profile');
        } else {
          showToast(`No profile found for "@${q.trim()}". Try searching for 'tourist' or 'neal_wu'.`);
        }
      };

      const openMyProfile = async () => {
        const handle = currentUser || 'coder';
        const p = await fetchProfile(handle);
        setProfile(p || buildDynamic(handle));
        setView('profile');
      };

      const handleAuthSuccess = (userPayload) => {
        const username = typeof userPayload === 'string' ? userPayload : (userPayload.username || 'coder');
        const userObj = typeof userPayload === 'object' ? userPayload : { username: userPayload, email: `${userPayload}@gmail.com` };

        setCurrentUser(username);
        setUserData(userObj);
        localStorage.setItem('pd_user', username);
        localStorage.setItem('pd_user_data', JSON.stringify(userObj));

        showToast(`Signed in as @${username}`);
        setView('handles');
      };

      const logout = () => {
        setCurrentUser(null);
        setUserData(null);
        localStorage.removeItem('pd_user');
        localStorage.removeItem('pd_user_data');
        localStorage.removeItem('pd_token');
        setView('home'); setProfile(null);
        showToast('Signed out successfully');
      };

      const userDisplayName = (userData?.name && !userData.name.includes('@'))
        ? userData.name
        : (profile && profile.username.toLowerCase() === (currentUser || '').toLowerCase() && profile.name && !profile.name.includes('@'))
          ? profile.name
          : (currentUser ? currentUser.replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : 'Coder');

      return (
        <React.Fragment>
          {/* ── NAVBAR ── */}
          <nav className="navbar">
            <a className="navbar-brand" onClick={() => { setView('home'); setProfile(null); }} style={{ cursor: 'pointer' }}>
              <div className="pd-logo"><span className="p">P</span><span className="d">D</span></div>
              ProfileDekho
            </a>

            <div className="navbar-actions">
              {/* Theme Switcher Toggle */}
              <button
                type="button"
                className="theme-toggle-btn"
                onClick={toggleTheme}
                title={theme === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'}
                aria-label="Toggle theme"
              >
                {theme === 'dark' ? (
                  /* Sun icon — shown in dark mode to switch to light */
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#DFCC18" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="4.5" fill="#DFCC18" fillOpacity="0.2" />
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
                  </svg>
                ) : (
                  /* Moon icon — shown in light mode to switch to dark */
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor" fillOpacity="0.15" />
                  </svg>
                )}
              </button>

              {currentUser ? (
                <React.Fragment>
                  <button className="btn btn-ghost" onClick={() => setView('handles')}>Edit handles</button>
                  <button className="user-pill" onClick={openMyProfile} title={userData?.email || currentUser}>
                    <img className="user-avatar-sm"
                      src={userData?.avatar || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(userDisplayName)}&backgroundColor=4A7FD4&textColor=ffffff`}
                      alt="" />
                    <span style={{ fontWeight: '600' }}>{userDisplayName}</span>
                    {userData?.provider && (
                      <span style={{
                        fontSize: '0.65rem',
                        fontWeight: '700',
                        padding: '1px 5px',
                        borderRadius: '4px',
                        background: userData.provider === 'google' ? '#E8F0FE' : 'var(--sand-300)',
                        color: userData.provider === 'google' ? '#1967D2' : 'var(--stone-800)'
                      }}>
                        {userData.provider}
                      </span>
                    )}
                  </button>
                  <button className="btn btn-ghost" onClick={logout}>Sign out</button>
                </React.Fragment>
              ) : (
                <div style={{ display: 'flex', gap: '8px' }}>
                  <button className="btn btn-ghost" onClick={() => setAuthModal('login')}>Sign in</button>
                  <button className="btn btn-primary" onClick={() => setAuthModal('register')}>Create account</button>
                </div>
              )}
            </div>
          </nav>

          {/* ── MAIN ── */}
          {view === 'home' && <HomePage onSearch={search} />}
          {view === 'profile' && profile && (
            <Showcase
              profile={profile}
              currentUser={currentUser}
              onProfileUpdate={(updated) => {
                setProfile(updated);
                if (userData) {
                  const newUserData = { ...userData, name: updated.name };
                  setUserData(newUserData);
                  localStorage.setItem('pd_user_data', JSON.stringify(newUserData));
                }
                showToast(`Profile updated!`);
              }}
            />
          )}
          {view === 'profile' && !profile && (
            <div style={{ padding: '60px 20px', textAlign: 'center', maxWidth: '500px', margin: '0 auto' }}>
              <div style={{ fontSize: '2.5rem', marginBottom: '12px' }}>🔍</div>
              <h2 style={{ fontSize: '1.4rem', fontWeight: '700', marginBottom: '8px' }}>User Not Found</h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem', marginBottom: '24px' }}>
                The requested profile does not exist. Please check the spelling or search for a verified developer profile.
              </p>
              <button className="btn btn-primary" onClick={() => { setView('home'); setProfile(null); }}>
                Back to Home Search
              </button>
            </div>
          )}
          {view === 'handles' && currentUser && (
            <HandlesForm
              currentUser={currentUser}
              onSave={(p) => { setProfile(p); setView('profile'); showToast('Profile handles updated & synced!'); }}
            />
          )}

          {authModal && (
            <AuthModal
              mode={authModal}
              onClose={() => setAuthModal(null)}
              onSuccess={handleAuthSuccess}
            />
          )}
          {toast && <div className="toast">{toast}</div>}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
